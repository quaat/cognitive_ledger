name: ci-integration
on:
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: docker compose config --quiet
      - run: ./scripts/test-integration.sh
