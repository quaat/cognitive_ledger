name: ci-integration
on:
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  docker:
    runs-on: ubuntu-latest
    # Normal runs take 8–9 minutes (Plans 0009/0010 hosted evidence); a hang must fail
    # within the hour, not run to GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0
      - run: docker compose config --quiet
      - run: ./scripts/test-integration.sh
