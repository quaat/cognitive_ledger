name: ci-differential
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2"
permissions: {contents: read}
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require verified reference pin
        id: pin
        run: |
          image=$(jq -r '.image // empty' test/reference-images.lock)
          if [ -z "$image" ]; then echo '::error::Fluree digest unresolved; see active plan'; exit 1; else echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - if: steps.pin.outputs.ready == 'true'
        run: ./scripts/test-differential.sh
