name: ci-security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 4"
permissions: {contents: read}
# Third-party actions are pinned by immutable commit SHA; the comment names the release.
jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: {persist-credentials: false}
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
  supply-chain:
    # Blocking: cargo audit (single documented exception, premise re-proven), cargo deny
    # (advisories, licenses, bans, sources) and the CycloneDX SBOMs of the shipped binaries
    # (filtered to the feature-resolved build graph; rsa/sqlx-mysql must not appear).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-cyclonedx@0.5.9
      - run: ./scripts/check-supply-chain.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: sbom-workspace
          path: target/sbom/*.cdx.json
          if-no-files-found: error
  container:
    # Build the runtime image exactly as compose does, emit its CycloneDX SBOM and the full
    # report first, then gate on CRITICAL/HIGH (fixed or not: an unfixed finding must be
    # classified in .trivyignore with a rationale, never dropped silently). The scanner
    # version is pinned to the one the classification in docs/quality/security.md used.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: {persist-credentials: false}
      - run: mkdir -p target/sbom target/scan
      - run: docker build -t cognitive_ledger-ledger:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: cognitive_ledger-ledger:ci
          format: cyclonedx
          output: target/sbom/ledger-image.cdx.json
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: cognitive_ledger-ledger:ci
          format: json
          output: target/scan/ledger-image.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: sbom-and-scan-image
          path: |
            target/sbom/ledger-image.cdx.json
            target/scan/ledger-image.json
          if-no-files-found: error
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: cognitive_ledger-ledger:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
