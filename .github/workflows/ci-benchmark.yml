name: ci-benchmark
# Plan 0010 (Phase 6A): the `ci` benchmark profile on every PR. Correctness assertions,
# dataset/manifest validity and `ledger-admin verify` are gates; timings are recorded as
# observations in the uploaded result.json (no performance threshold yet). The benchmark run
# itself talks only to the loopback stack: images and crates are fetched before it starts.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  benchmark-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (v2.9.2)
      - run: docker compose config --quiet
      - run: ./scripts/benchmark.sh ci
      - if: ${{ !cancelled() }}
        run: cat target/benchmark/*-ci/report.md >>"$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: benchmark-ci
          path: |
            target/benchmark/*-ci/result.json
            target/benchmark/*-ci/report.md
            target/benchmark/*-ci/phases.txt
            target/benchmark/*-ci/run.log
            target/benchmark/*-ci/verify.log
          if-no-files-found: error
