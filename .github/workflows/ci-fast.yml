name: ci-fast
on:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read}
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0
        with: {components: rustfmt, clippy}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 (v2.9.2)
      - run: ./scripts/quality-gate.sh fast
