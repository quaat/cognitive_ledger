name: ci-fast
on:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read}
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
        with: {components: rustfmt, clippy}
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/quality-gate.sh fast
