name: ci-fuzz
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
permissions: {contents: read}
# Bounded libFuzzer runs of every target on the checked-in corpora (Plan 0005 §5). Longer
# local runs are recorded in docs/exec-plans/active/0005-*. Nightly is required by cargo-fuzz
# (sanitizer builds); it is pinned to a date and used only for this job.
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0 (action commit; toolchain below)
        with:
          toolchain: nightly-2026-09-25
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-fuzz
      - run: ./scripts/fuzz.sh 45
        env:
          FUZZ_TOOLCHAIN: nightly-2026-09-25
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: fuzz-logs
          path: |
            target/fuzz/**
            fuzz/artifacts/**
          if-no-files-found: ignore
