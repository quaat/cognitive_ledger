[package]
name = "ledger-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
fs2 = "0.4.3"
ledger-core = { path = "../ledger-core" }
ledger-dag = { path = "../ledger-dag" }
ledger-merge = { path = "../ledger-merge" }
ledger-rdf = { path = "../ledger-rdf" }
ledger-validation-protocol = { path = "../ledger-validation-protocol" }
serde.workspace = true
sha2.workspace = true
hex.workspace = true
sqlx = { workspace = true, optional = true }
time.workspace = true
tokio = { workspace = true }

[features]
postgres = ["dep:sqlx"]
# Deterministic pause points for forced-interleaving tests (`src/test_hooks.rs`). Never
# enabled by a binary; only this crate's test targets turn it on (dev-dependency below).
test-hooks = []

[dev-dependencies]
# Self dev-dependency: the test targets (and only they) build the library with `test-hooks`.
ledger-store = { path = ".", features = ["test-hooks"] }
tempfile.workspace = true

[lints]
workspace = true
