# Development / integration-test harness only. The baked credentials
# (`ledger-development-only`) and `sslmode=disable` are intentional for local and CI
# use and MUST NOT be reused as a production deployment: a real deployment injects
# LEDGER_DATABASE_URL with managed secrets and TLS. This file is not a deploy artifact.
services:
  # One-shot schema owner step (ADR-0016): applies migrations 0001..N on a dedicated owner
  # connection and grants the pre-created runtime role. The server below starts only after
  # this completed successfully and connects with the RUNTIME identity, which cannot run DDL.
  migrate:
    build: .
    entrypoint: ["/usr/local/bin/ledger-admin"]
    command: ["migrate", "--runtime-role", "ledger_runtime", "--projector-role", "ledger_projector"]
    restart: "no"
    environment:
      LEDGER_MIGRATION_DATABASE_URL: postgres://ledger:ledger-development-only@postgres:5432/ledger?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
  ledger:
    build: .
    environment:
      LEDGER_DATA_DIR: /data
      LEDGER_ADDR: 0.0.0.0:8080
      # With a database URL the server defaults to PostgreSQL for BOTH the mutable ref
      # head (ADR-0004/0007) and the immutable objects (ADR-0012 shared store): the only
      # topology in which a shared ref never references node-local content. /data is
      # used only when LEDGER_IMMUTABLE_BACKEND=filesystem is set explicitly (single host).
      # RUNTIME identity (least privilege, ADR-0016): created by deploy/postgres-init,
      # granted by the migrate service. The owner URL is deliberately absent here.
      LEDGER_DATABASE_URL: postgres://ledger_runtime:ledger-runtime-development-only@postgres:5432/ledger?sslmode=disable
      # DEVELOPMENT AUTHENTICATION ONLY. The server has no unauthenticated mode; this
      # harness uses the HS256 development authenticator with a baked secret so the
      # integration test can mint tokens. Production uses LEDGER_AUTH_MODE=oidc with the
      # identity provider's issuer, audience and JWKS URL (docs/quality/security.md).
      LEDGER_AUTH_MODE: dev-hs256
      LEDGER_AUTH_ISSUER: https://dev-issuer.example/
      LEDGER_AUTH_AUDIENCE: api://sculpin-ledger-dev
      LEDGER_AUTH_DEV_HS256_SECRET: development-only-hs256-secret-not-for-production-use
      # The container binds 0.0.0.0 inside its own network namespace (published on host
      # loopback below). A non-loopback bind with non-production authentication is refused
      # unless this conspicuous development switch is set.
      LEDGER_ALLOW_INSECURE_NON_LOOPBACK: allow-insecure-non-loopback-development-only
      # Phase 2 supplies semantic validation; until then `accept` fails closed unless this
      # development/CI switch is set. Never set in production.
      LEDGER_UNVALIDATED_ACCEPTANCE: allow-unvalidated-acceptance-development-only
    volumes: [ledger-data:/data]
    # Loopback only: a development ledger must not be reachable from the LAN.
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The runtime image has no shell or curl; the probe is a loopback GET by ledger-admin.
      test: ["CMD", "/usr/local/bin/ledger-admin", "probe", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
  postgres:
    image: postgres:17.2-bookworm@sha256:3267c505060a0052e5aa6e5175a7b41ab6b04da2f8c4540fc6e98a37210aa2d3
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger-development-only
      POSTGRES_DB: ledger
    # Creates the development runtime role (ADR-0016); see deploy/postgres-init/.
    volumes: ["./deploy/postgres-init:/docker-entrypoint-initdb.d:ro"]
    # Published on loopback only for the host-run PostgreSQL tests (scripts/test-integration.sh).
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 12
  fuseki:
    image: stain/jena-fuseki:5.1.0@sha256:b1d0c96f19adddef417520184471ac816cf36c6e72936a88ea02b29f4305929a
    profiles: [projection]
    # The ledger's own TDB2 dataset definition (ADR-0020): named query/update endpoints only.
    command: ["/jena-fuseki/fuseki-server", "--config=/staging/ledger-projection.ttl"]
    volumes:
      - ./deploy/fuseki/ledger-projection.ttl:/staging/ledger-projection.ttl:ro
    ports:
      - "127.0.0.1:53030:3030"
      # The projector shares this network namespace (below); its /health /ready /metrics.
      - "127.0.0.1:59464:9464"
    environment:
      ADMIN_PASSWORD: development-only
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3030/$/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
  # Accepted-state projector (ADR-0020/0021). Development: it shares Fuseki's network
  # namespace so the target is a loopback http endpoint; production uses https and a
  # dedicated credential. It connects with the PROJECTOR identity (deploy/postgres-init,
  # granted by the migrate service), never the owner or the runtime identity.
  projector:
    build: .
    profiles: [projection]
    entrypoint: ["/usr/local/bin/ledger-projector"]
    network_mode: "service:fuseki"
    environment:
      LEDGER_PROJECTOR_DATABASE_URL: postgres://ledger_projector:ledger-projector-development-only@postgres:5432/ledger?sslmode=disable
      LEDGER_PROJECTION_TARGET_ID: fuseki
      LEDGER_PROJECTION_QUERY_URL: http://127.0.0.1:3030/ledger/query
      LEDGER_PROJECTION_UPDATE_URL: http://127.0.0.1:3030/ledger/update
      LEDGER_PROJECTION_USERNAME: admin
      LEDGER_PROJECTION_PASSWORD_FILE: /run/secrets/fuseki-password
      LEDGER_PROJECTOR_DEVELOPMENT: allow-insecure-development-only
      LEDGER_PROJECTOR_ADDR: 0.0.0.0:9464
      LEDGER_PROJECTOR_POLL_MS: "250"
      RUST_LOG: info
    volumes: ["./deploy/fuseki/development-admin-password:/run/secrets/fuseki-password:ro"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      fuseki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/ledger-admin", "probe", "http://127.0.0.1:9464/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
  fluree-reference:
    # Test-reference only (BUSL-1.1). Pinned by digest but gated behind the
    # 'differential' profile and NOT run in CI pending license sign-off; see
    # test/reference-images.lock.
    image: fluree/server:4.2.1@sha256:14da004ab020f7ae4e19696941206f027ef7dda7ba985a82ea101fee1039f770
    profiles: [differential]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8090 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
volumes:
  ledger-data: {}
