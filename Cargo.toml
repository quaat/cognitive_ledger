[workspace]
members = [
  "crates/ledger-core",
  "crates/ledger-rdf",
  "crates/ledger-store",
  "crates/ledger-api",
  "crates/ledger-testkit",
  "apps/ledger-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
async-trait = "0.1.83"
axum = "0.8.4"
hex = "0.4.3"
# >= 10.3.0 fixes GHSA-h395-gr6q-cpjc (malformed exp/nbf treated as absent). The aws-lc-rs
# backend is chosen over rust_crypto so the `rsa` crate (RUSTSEC-2023-0071) stays
# unreachable in every built binary; see .cargo/audit.toml.
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "json"] }
oxrdf = "=0.3.4"
oxttl = "0.2.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate"] }
tempfile = "3.20.0"
thiserror = "2.0.12"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
