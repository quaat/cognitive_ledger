[package]
name = "ledger-projector"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Accepted-state projector (ADR-0020/0021): consumes projection_outbox under stream leases and maintains the cognitive named graph in the projection target."

[dependencies]
axum.workspace = true
ledger-core = { path = "../../crates/ledger-core" }
ledger-projection = { path = "../../crates/ledger-projection" }
ledger-projection-fuseki = { path = "../../crates/ledger-projection-fuseki" }
ledger-rdf = { path = "../../crates/ledger-rdf" }
ledger-store = { path = "../../crates/ledger-store", features = ["postgres"] }
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Deterministic crash windows for the projection tests (`FailPoint`, Plan 0013 F5). Never
# enabled by the binary; only this crate's test targets turn it on (dev-dependency below).
test-hooks = []

[dev-dependencies]
# Self dev-dependency: the test targets (and only they) build the library with `test-hooks`.
ledger-projector = { path = ".", features = ["test-hooks"] }
async-trait.workspace = true
reqwest.workspace = true
sqlx.workspace = true

[lints]
workspace = true
